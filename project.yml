name: Dimera
options:
  bundleIdPrefix: com.dimera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Dimera:
    type: application
    platform: iOS
    sources:
      - path: Dimera
        excludes:
          - App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimera.app
        PRODUCT_NAME: Dimera
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Dimera/App/Info.plist
    scheme:
      storeKitConfiguration: Dimera/Products.storekit
